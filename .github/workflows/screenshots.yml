name: Signed release screenshots
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v0.3.0
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p .release/screenshots
          gh release download "$RELEASE_TAG" --dir .release/screenshots --pattern '*.apk' --pattern SHA256SUMS.txt
          (cd .release/screenshots && sha256sum -c SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs .release/screenshots/*.apk > .release/screenshots/certificate.txt
          grep -F "Signer #1 certificate SHA-256 digest: $(grep -E '^[0-9a-f]{64}$' SIGNING.md)" .release/screenshots/certificate.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: python3 scripts/capture_release_ui.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: signed-release-screenshots
          path: .shots/release-ui/
