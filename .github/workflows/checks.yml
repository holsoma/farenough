name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free space for the Android system image
        # These toolchains are unused by this Kotlin-only job on an ephemeral runner.
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: device-reports
          path: app/build/reports/androidTests/
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
